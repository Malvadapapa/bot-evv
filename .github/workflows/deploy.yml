name: Deploy to Windows Server VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Actualizar repositorio
        run: |
          git pull origin main

      - name: Instalar dependencias
        run: |
          npm install

      - name: Compilar TypeScript
        run: |
          npm run build

      - name: Reiniciar bot en PM2
        run: |
          pm2 restart bot-evv
